<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas - Festa da Padroeira 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#12376e">
    <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>
    <div class="bandeirinhas">
        <div class="bandeirinha b1"></div><div class="bandeirinha b2"></div>
        <div class="bandeirinha b3"></div><div class="bandeirinha b4"></div>
        <div class="bandeirinha b5"></div><div class="bandeirinha b6"></div>
        <div class="bandeirinha b7"></div><div class="bandeirinha b8"></div>
        <div class="bandeirinha b9"></div><div class="bandeirinha b10"></div>
        <div class="bandeirinha b11"></div><div class="bandeirinha b12"></div>
    </div>

    <header class="header">
        <h1>ESCALA DE CAIXAS</h1>
        <p>Festa da Padroeira 2026</p>
        <p class="header-datas">09, 10, 11 e 12 de Outubro</p>
    </header>

    <div class="status-bar">
        <div class="status-left">
            <span class="firebase-status" id="firebaseStatus"><span class="status-dot offline"></span> Conectando...</span>
            <span id="saveStatus" style="font-size:0.8rem;font-weight:700"></span>
        </div>
        <div class="status-right">
            <button class="btn-historico" onclick="atualizarDados()">🔄 Atualizar</button>
        </div>
    </div>

    <main class="container">
        <section class="section active">
            <div class="painel-madeira">
                <h3>Cadastrar Pessoa</h3>
                <div class="form-row">
                    <input type="text" id="caixaNome" placeholder="Nome completo" style="flex:2;min-width:180px">
                    <input type="tel" id="caixaTelefone" placeholder="Telefone (opcional)" style="flex:1;min-width:160px">
                    <select id="caixaTipo" onchange="atualizarDiasDisponiveis()" style="flex:1;min-width:170px">
                        <option value="">Selecione o tipo...</option>
                        <option value="fixo">Caixa Fixo</option>
                        <option value="volante">Caixa Volante</option>
                    </select>
                </div>
                <div class="form-row" id="rowDiasCaixa" style="display:none">
                    <span style="font-size:0.85rem;color:var(--cor-palha);font-weight:600;margin-right:8px">Dias disponíveis:</span>
                    <label class="checkbox-opt" id="labelCaixaDia1"><input type="checkbox" id="caixaDia1"> 09/Out</label>
                    <label class="checkbox-opt" id="labelCaixaDia2"><input type="checkbox" id="caixaDia2"> 10/Out</label>
                    <label class="checkbox-opt" id="labelCaixaDia3"><input type="checkbox" id="caixaDia3"> 11/Out</label>
                    <label class="checkbox-opt" id="labelCaixaDia4"><input type="checkbox" id="caixaDia4"> 12/Out</label>
                    <button class="btn-venda" onclick="cadastrarCaixa()">Cadastrar</button>
                </div>
                <div id="avisoLimiteCaixas" style="font-size:0.8rem;color:#ef5350;margin-top:8px;display:none"></div>
            </div>

            <div class="resumo-barraca" id="resumoCaixas" style="margin:15px 0"></div>

            <div class="export-btns" style="padding:10px 0">
                <button class="btn-export" onclick="exportarEscalaPDF()">📄 Exportar Escala PDF</button>
            </div>

            <div id="caixasPorDia"></div>

            <div class="tabela-box" style="margin-top:15px">
                <h4>Todos os Caixas Cadastrados</h4>
                <table id="tabelaCaixas">
                    <thead><tr><th>Nome</th><th>Telefone</th><th>Tipo</th><th>Dias</th><th></th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="modalOverlay" onclick="fecharModal()" style="display:none">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="modalTitulo">Editar</h3>
            <div id="modalConteudo"></div>
            <div class="modal-btns">
                <button class="btn-venda" onclick="salvarEdicaoCaixa()">Salvar</button>
                <button class="btn-gasto" onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>Basílica Menor Nossa Senhora da Conceição Aparecida</p>
        <p>Festa da Padroeira 2026 | Escala de Caixas</p>
    </footer>

    <script src="firebase-config.js"></script>
    <script src="shared.js"></script>
    <script src="pagina-caixas.js"></script>
</body>
</html>
